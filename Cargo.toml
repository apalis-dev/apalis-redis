[package]
name = "apalis-redis"
version = "1.0.0-rc.9"
authors = ["Njuguna Mureithi <mureithinjuguna@gmail.com>"]
edition = "2024"
repository = "https://github.com/apalis-dev/apalis-redis"
license = "MIT"
description = "Background task processing for rust using apalis and redis"
keywords = ["background", "jobs", "queue", "redis", "async"]
categories = ["asynchronous", "database"]
readme = "README.md"
homepage = "https://github.com/apalis-dev/apalis-redis"
documentation = "https://docs.rs/apalis-redis"
include = ["src/**", "lua/**", "Cargo.toml", "README.md", "LICENSE"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
apalis-codec = { version = "0.1.0-rc.10", default-features = false, features = [
    "json",
] }
apalis-core = { version = "1.0.0-rc.10", features = ["sleep", "ulid", "serde"] }
redis = { version = "1.7.0", default-features = false, features = [
    "script",
    "aio",
    "connection-manager",
] }
serde = "1"
futures = "0.3.34"
tokio = { version = "1", features = ["rt", "net"], optional = true }
smol = { version = "2", optional = true }
thiserror = "2.0.20"
ulid = { version = "3", features = ["serde"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
apalis = { version = "1.0.0-rc.10" }
apalis-workflow = { version = "0.1.0-rc.10" }
apalis-codec = { version = "0.1.0-rc.10", features = ["msgpack", "bincode"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
redis = { version = "1.7.0", default-features = false, features = ["sentinel"] }

[features]
default = ["tokio-comp"]
smol-comp = ["smol", "redis/smol-comp"]
tokio-comp = ["tokio", "tokio/net", "redis/tokio-comp"]
