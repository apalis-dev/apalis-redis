name: Update Changelog

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    if: contains(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest

    env:
      CARGO_VET_VERSION: 0.10.1

    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/cargo-vet
          key: cargo-vet-bin-${{ env.CARGO_VET_VERSION }}

      - name: Add the tool cache directory to PATH
        run: echo "${{ runner.tool_cache }}/cargo-vet/bin" >> "$GITHUB_PATH"

      - name: Ensure cargo-vet is installed
        run: |
          cargo install \
            --root "${{ runner.tool_cache }}/cargo-vet" \
            --version "${{ env.CARGO_VET_VERSION }}" \
            cargo-vet

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Regenerate cargo vet exemptions
        run: cargo vet regenerate exemptions

      - name: Commit cargo-vet changes
        run: |
          git add supply-chain/*
          git commit -m "vet: update cargo vet exemptions" || echo "No changes to commit"

      - name: Update CHANGELOG
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          FORMATTED_TITLE="$(echo "$PR_TITLE" | sed -E 's/^([a-zA-Z0-9_-]+):/*\1*:/')"

          CHANGELOG_ENTRY="- ${FORMATTED_TITLE} ([#${PR_NUMBER}](https://github.com/${REPO}/pull/${PR_NUMBER}))"

          awk -v entry="$CHANGELOG_ENTRY" '
          /^## \[Unreleased\]$/ {
              print
              print ""
              print entry
              skip_blank=1
              next
          }

          skip_blank && /^$/ {
              skip_blank=0
              next
          }

          {
              skip_blank=0
              print
          }
          ' CHANGELOG.md > CHANGELOG.md.tmp

          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Commit CHANGELOG changes
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for PR #${{ github.event.pull_request.number }}" || echo "No changes to commit"

      - name: Push commits
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
